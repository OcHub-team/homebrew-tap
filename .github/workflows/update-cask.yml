name: Update OcHub cask

on:
  repository_dispatch:
    types:
      - ochub_release_published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing OcHub release tag; leave blank to use the latest release
        required: false
        type: string
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-ochub-cask
  cancel-in-progress: false

jobs:
  update:
    name: Update from the latest OcHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Update version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.tag || inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            [[ "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
            release_json="$(
              gh api "repos/OcHub-team/OcHub/releases/tags/${REQUESTED_TAG}"
            )"
          else
            release_json="$(gh api repos/OcHub-team/OcHub/releases/latest)"
          fi

          test "$(jq -er '.draft' <<<"${release_json}")" = "false"
          test "$(jq -er '.prerelease' <<<"${release_json}")" = "false"
          tag="$(jq -er '.tag_name' <<<"${release_json}")"
          if [ -n "${REQUESTED_TAG}" ]; then
            test "${tag}" = "${REQUESTED_TAG}"
          fi
          version="${tag#v}"
          test "${tag}" = "v${version}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]

          arm_name="OcHub_${version}_aarch64.dmg"
          intel_name="OcHub_${version}_x64.dmg"
          arm_url="$(
            jq -er --arg name "${arm_name}" \
              '[.assets[] | select(.name == $name) | .browser_download_url] |
               if length == 1 then .[0] else error("missing or duplicate ARM64 DMG") end' \
              <<<"${release_json}"
          )"
          intel_url="$(
            jq -er --arg name "${intel_name}" \
              '[.assets[] | select(.name == $name) | .browser_download_url] |
               if length == 1 then .[0] else error("missing or duplicate Intel DMG") end' \
              <<<"${release_json}"
          )"

          download_dir="$(mktemp -d "${RUNNER_TEMP}/ochub-homebrew.XXXXXX")"
          curl --fail --location --silent --show-error \
            --output "${download_dir}/${arm_name}" "${arm_url}"
          curl --fail --location --silent --show-error \
            --output "${download_dir}/${intel_name}" "${intel_url}"
          arm_sha="$(sha256sum "${download_dir}/${arm_name}" | cut -d ' ' -f 1)"
          intel_sha="$(sha256sum "${download_dir}/${intel_name}" | cut -d ' ' -f 1)"

          ruby - "${version}" "${arm_sha}" "${intel_sha}" <<'RUBY'
          path, version, arm_sha, intel_sha = "Casks/ochub.rb", *ARGV
          content = File.read(path)
          version_pattern = /^  version "[^"]+"$/
          checksum_pattern = /^  sha256 arm:\s+"[0-9a-f]{64}",\n\s+intel: "[0-9a-f]{64}"$/
          abort "version stanza not found" unless content.match?(version_pattern)
          abort "checksum stanza not found" unless content.match?(checksum_pattern)

          updated = content.sub(version_pattern, %(  version "#{version}"))
          checksums = format(
            "  sha256 arm:   \"%s\",\n         intel: \"%s\"",
            arm_sha,
            intel_sha,
          )
          updated = updated.sub(checksum_pattern, checksums)
          File.write(path, updated)
          RUBY

          ruby -c Casks/ochub.rb
          git diff --check
          if git diff --quiet; then
            echo "OcHub ${version} is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ochub.rb
          git commit -m "Update OcHub cask to ${version}"
          git push
